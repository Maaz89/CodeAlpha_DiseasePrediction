<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardio Diagnostic Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .section-header { border-bottom: 2px solid #dee2e6; padding-bottom: 8px; margin-bottom: 20px; font-weight: 600; color: #495057; }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 850px;">
    <div class="text-center mb-4">
        <h1 class="display-6 fw-bold text-dark">❤️ Cardiovascular Disease Screening Center</h1>
        <p class="text-muted">Multi-Classifier ML Ensemble Inference Engine (SVM, LR, RF, XGBoost)</p>
    </div>

    {% if prediction_text %}
    <div class="alert alert-{{ result_class }} p-4 mb-4 card" role="alert">
        <h4 class="alert-heading fw-bold">🎯 {{ prediction_text }}</h4>
        <p class="mb-0 fw-semibold">{{ details_text }}</p>
    </div>
    {% endif %}

    <div class="card p-4 bg-white">
        <form action="/predict" method="POST">
            
            <div class="section-header">🩺 Demographics & Basic Vitals</div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Patient Age</label>
                    <input type="number" name="age" class="form-control" value="52" min="1" max="120" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Biological Sex</label>
                    <select name="sex" class="form-select" required>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Chest Pain Category</label>
                    <select name="cp" class="form-select" required>
                        <option value="0">0: Asymptomatic</option>
                        <option value="1">1: Typical Angina</option>
                        <option value="2">2: Atypical Angina</option>
                        <option value="3">3: Non-anginal Pain</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Resting Blood Pressure (mm Hg)</label>
                    <input type="number" name="trestbps" class="form-control" value="130" min="50" max="250" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Serum Cholesterol (mg/dl)</label>
                    <input type="number" name="chol" class="form-control" value="240" min="100" max="600" required>
                </div>
            </div>

            <div class="section-header">🔬 Metabolic & ECG Profiles</div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Fasting Blood Sugar > 120 mg/dl</label>
                    <select name="fbs" class="form-select" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Resting ECG Results</label>
                    <select name="restecg" class="form-select" required>
                        <option value="0">0: Normal</option>
                        <option value="1">1: ST-T Wave Anomaly</option>
                        <option value="2">2: Left Ventricular Hypertrophy</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Max Heart Rate Achieved</label>
                    <input type="number" name="thalach" class="form-control" value="150" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Exercise Induced Angina</label>
                    <select name="exang" class="form-select" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">ST Depression induced by Exercise (Oldpeak)</label>
                    <input type="number" name="oldpeak" class="form-control" value="1.0" step="0.1" required>
                </div>
            </div>

            <div class="section-header">🧬 Advanced Cardiac Markers</div>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Peak Exercise ST Slope</label>
                    <select name="slope" class="form-select" required>
                        <option value="1">1: Upsloping</option>
                        <option value="2">2: Flat</option>
                        <option value="3">3: Downsloping</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Fluoroscopy Major Vessels (0-3)</label>
                    <select name="ca" class="form-select" required>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Thalassemia Status Code</label>
                    <select name="thal" class="form-select" required>
                        <option value="3">3: Normal</option>
                        <option value="6">6: Fixed Defect</option>
                        <option value="7">7: Reversible Defect</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm mt-3">🩺 DEPLOY DIAGNOSTIC INFERENCE PIPELINE</button>
        </form>
    </div>
</div>

</body>
</html>
